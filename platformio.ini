[platformio]
default_envs = cores3_range, cores3_uart

[env]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    m5stack/M5Unified@0.2.22
    m5stack/M5GFX@0.2.29
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:cores3_uart]
build_src_filter = +<uart_main.cpp>
build_flags =
    ${env.build_flags}
    -DFW_VERSION=\"1.2.0-uart\"

[env:cores3_range]
build_src_filter = +<range_main.cpp>
build_flags =
    ${env.build_flags}
    -DFW_VERSION=\"1.3.0-range\"
